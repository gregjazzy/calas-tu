<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="50%" stop-color="#2d1b5e"/>
      <stop offset="100%" stop-color="#4a2a8a"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>

  <!-- Glow central -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Étoiles -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="430" cy="80" r="2"/>
    <circle cx="60" cy="350" r="2.5"/>
    <circle cx="450" cy="400" r="3"/>
    <circle cx="380" cy="170" r="2"/>
    <circle cx="120" cy="440" r="2"/>
    <circle cx="420" cy="260" r="2.5"/>
  </g>

  <!-- Symboles math -->
  <g fill="#ffd166" opacity="0.9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-weight="800" font-size="42" text-anchor="middle">
    <text x="105" y="220">×</text>
    <text x="410" y="220">+</text>
    <text x="105" y="320">÷</text>
    <text x="410" y="330">−</text>
  </g>

  <!-- Lettre C stylisée -->
  <g transform="translate(256 280)">
    <circle r="115" fill="none" stroke="url(#logo)" stroke-width="34" stroke-linecap="round"
            stroke-dasharray="540 1000" transform="rotate(35)"/>
  </g>

  <!-- Petit éclair central -->
  <path d="M 256 195 L 232 260 L 256 260 L 240 320 L 286 245 L 264 245 L 280 195 Z"
        fill="#ffd166" stroke="#1a0b3d" stroke-width="3" stroke-linejoin="round"/>
</svg>
